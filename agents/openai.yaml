display_name: Wall Street Equity Research
short_description: Build a source-linked, decision-first stock report with portfolio-aware actions.
default_prompt: Use $wall-street-equity-research with the v3 Spec initializer and one persisted evidence pack. Run reports sequentially with run_reports.py, resume saved artifacts, and use minimal child context (never full-history fork); use validated Terra/high extraction and factual sections, Luna/max mechanical mappings, and Sol/medium investment judgment with full verify plus independent lint. Analyze this stock from verified data through competing logic to a direct report. Apply hold-equals-buy, opportunity cost, and 10-year payback; return the canonical Buy / Hold-Index / Watchlist / Avoid verdict, and separate the research candidate from any executable portfolio action.
