name: Clean generated valuation files

on:
  push:
    branches:
      - feat/valuation-consistency

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/valuation-consistency
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove accidental leading continuation lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('references/valuation-consistency.md'),
              Path('scripts/valuation_consistency.py'),
              Path('templates/full-report.md'),
              Path('tests/test_valuation_consistency.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if text.startswith('\\\n'):
                  path.write_text(text[2:], encoding='utf-8')
          PY

      - name: Compile
        run: python3 -m py_compile scripts/*.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Report lint self-test
        run: python3 scripts/report_lint.py --self-test

      - name: Report lint fixtures
        run: python3 scripts/report_lint.py --fixtures tests/fixtures

      - name: Diff check
        run: git diff --check

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-valuation-upgrade.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove generated leading continuation lines"
          git push origin HEAD:feat/valuation-consistency
