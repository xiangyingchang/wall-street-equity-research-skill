name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py

      - name: Run validation self-tests
        run: |
          python scripts/financial_rigor.py --self-test
          python scripts/report_audit.py --self-test
          python scripts/report_lint.py --self-test
          python scripts/report_lint.py --fixtures tests/fixtures
          python -m unittest discover -s tests

      - name: Run v2.1.2 compiler end-to-end
        run: |
          mkdir -p /tmp/report-v212
          python tests/meta_v21_spec.py /tmp/report-v212/meta.spec.json
          python scripts/report_pipeline_v2.py build --spec /tmp/report-v212/meta.spec.json --output /tmp/report-v212/meta.md
          python scripts/report_pipeline_v2.py verify --spec /tmp/report-v212/meta.spec.json --output /tmp/report-v212/meta.md
          test -f /tmp/report-v212/meta.md
          test -f /tmp/report-v212/meta.audit.md
          ! grep -q "FACT-" /tmp/report-v212/meta.md
          ! grep -q "Source Registry" /tmp/report-v212/meta.md
          ! grep -q "Claim-Evidence Matrix" /tmp/report-v212/meta.md
          grep -q "## Claim-Evidence Matrix" /tmp/report-v212/meta.audit.md

      - name: Run v3.1 data-reasoning-reader end-to-end
        run: |
          mkdir -p /tmp/report-v3
          python tests/meta_v3_spec.py /tmp/report-v3/meta.spec.json
          python scripts/report_pipeline_v3.py build --spec /tmp/report-v3/meta.spec.json --output /tmp/report-v3/meta.md
          python scripts/report_pipeline_v3.py verify --spec /tmp/report-v3/meta.spec.json --output /tmp/report-v3/meta.md
          python scripts/report_lint.py /tmp/report-v3/meta.md
          test -f /tmp/report-v3/meta.md
          test -f /tmp/report-v3/meta.audit.md
          test -f /tmp/report-v3/meta.md.bundle.json
          test -f /tmp/report-v3/meta.md.verification.json
          grep -q "### Action Matrix（唯一执行口径）" /tmp/report-v3/meta.md
          grep -q "### 三条原投资原则" /tmp/report-v3/meta.md
          grep -q "### Base 情景关键假设" /tmp/report-v3/meta.md
          grep -q "## 1. Overview：商业模式与本次财报" /tmp/report-v3/meta.md
          grep -q "### Key Forces" /tmp/report-v3/meta.md
          grep -q "本次财报改变了什么" /tmp/report-v3/meta.md
          grep -q "### 决定回报的投资主线" /tmp/report-v3/meta.md
          grep -q "### 最强正反证据与裁决" /tmp/report-v3/meta.md
          grep -q "### 真正决定估值的变量" /tmp/report-v3/meta.md
          grep -q "### 什么会改变结论" /tmp/report-v3/meta.md
          for heading in "### 现金口径估值" "### 三口径回本测试" "### 同业对比" "### 情景经营前提" "### 正常化桥" "### CapEx、研发与资产负债表" "### 新资金价格阶梯" "### Action Triggers" "### Pre-Mortem" "### 最小复核清单" "年税后股息" "年趋势" "**流动性：**" "### 现金流升级表" "### ROIC 与增量 ROIC" "利润率 × 退出市盈率" "可执行新资金上限" "决定买点的口径"; do grep -qF "$heading" /tmp/report-v3/meta.md || { echo "missing v3.2 section: $heading"; exit 1; }; done
          test "$(grep -c "◀ 价格所在" /tmp/report-v3/meta.md)" -eq 1
          test "$(grep -c "◀ 当前级" /tmp/report-v3/meta.md)" -eq 1
          grep -q "### Decision Sensitivity (quantified)" /tmp/report-v3/meta.audit.md
          grep -q "## Research Graph v3.1" /tmp/report-v3/meta.audit.md
          grep -q "](https://" /tmp/report-v3/meta.md
          test "$(grep -c "### Action Matrix（唯一执行口径）" /tmp/report-v3/meta.md)" -eq 1
          grep -q "THEME-CAPITAL-RETURNS" /tmp/report-v3/meta.audit.md
          grep -q "Auto-discounted:" /tmp/report-v3/meta.audit.md
          ! grep -Eq "\*\*(核心问题|发生了什么|基础判断|最强反方|综合裁决|对决策的影响|什么会推翻判断)：\*\*" /tmp/report-v3/meta.md
          ! grep -Eq "THEME-|OBS-|ARG-|DRV-|FACT-|SRC-|BUNDLE:|Source Registry|Evidence Ledger|Claim-Evidence Matrix|hash" /tmp/report-v3/meta.md
