name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py

      - name: Run validation self-tests
        run: |
          python scripts/financial_rigor.py --self-test
          python scripts/report_audit.py --self-test
          python scripts/report_lint.py --self-test
          python scripts/report_lint.py --fixtures tests/fixtures
          python -m unittest discover -s tests

      - name: Run v2.1.2 compiler end-to-end
        run: |
          mkdir -p /tmp/report-v212
          python tests/meta_v21_spec.py /tmp/report-v212/meta.spec.json
          python scripts/report_pipeline_v2.py build --spec /tmp/report-v212/meta.spec.json --output /tmp/report-v212/meta.md
          python scripts/report_pipeline_v2.py verify --spec /tmp/report-v212/meta.spec.json --output /tmp/report-v212/meta.md
          test -f /tmp/report-v212/meta.md
          test -f /tmp/report-v212/meta.audit.md
          ! grep -q "FACT-" /tmp/report-v212/meta.md
          grep -q "## Claim-Evidence Matrix" /tmp/report-v212/meta.audit.md

      - name: Run v3 research graph end-to-end
        run: |
          mkdir -p /tmp/report-v3
          python tests/meta_v3_spec.py /tmp/report-v3/meta.spec.json
          python scripts/report_pipeline_v3.py build --spec /tmp/report-v3/meta.spec.json --output /tmp/report-v3/meta.md
          python scripts/report_pipeline_v3.py verify --spec /tmp/report-v3/meta.spec.json --output /tmp/report-v3/meta.md
          test -f /tmp/report-v3/meta.md
          test -f /tmp/report-v3/meta.audit.md
          test -f /tmp/report-v3/meta.md.bundle.json
          test -f /tmp/report-v3/meta.md.verification.json
          grep -q "## 1. 投资叙事与核心矛盾" /tmp/report-v3/meta.md
          grep -q "### Bull vs Bear 投资辩论" /tmp/report-v3/meta.md
          grep -q "### 哪些假设真正决定估值" /tmp/report-v3/meta.md
          grep -q "## Research Graph v3" /tmp/report-v3/meta.audit.md
          grep -q "THEME-CAPITAL-RETURNS" /tmp/report-v3/meta.audit.md
          ! grep -q "THEME-" /tmp/report-v3/meta.md
          ! grep -q "ARG-" /tmp/report-v3/meta.md
