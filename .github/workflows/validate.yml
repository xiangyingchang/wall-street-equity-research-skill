name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/*.py

      - name: Run validation self-tests
        run: |
          python scripts/financial_rigor.py --self-test
          python scripts/report_audit.py --self-test
          python scripts/report_lint.py --self-test
          python scripts/report_lint.py --fixtures tests/fixtures
          python -m unittest tests/test_validation_cli.py
