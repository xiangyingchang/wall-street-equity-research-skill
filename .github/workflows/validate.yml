name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/*.py

      - name: Run validation self-tests
        run: |
          python scripts/financial_rigor.py --self-test
          python scripts/report_audit.py --self-test
          python scripts/report_lint.py --self-test
          python scripts/report_lint.py --fixtures tests/fixtures
          python -m unittest discover -s tests

      - name: Run v2 compiler end-to-end
        run: |
          mkdir -p /tmp/report-v2
          python scripts/report_pipeline_v2.py build \
            --spec tests/fixtures/meta_v2_spec.json \
            --output /tmp/report-v2/meta.md
          python scripts/report_pipeline_v2.py verify \
            --spec tests/fixtures/meta_v2_spec.json \
            --output /tmp/report-v2/meta.md
          test -f /tmp/report-v2/meta.md
          test -f /tmp/report-v2/meta.md.bundle.json
          test -f /tmp/report-v2/meta.md.verification.json
          ! grep -q "Legacy Compatibility" /tmp/report-v2/meta.md
