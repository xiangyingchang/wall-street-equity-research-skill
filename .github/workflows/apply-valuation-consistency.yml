name: Apply valuation consistency upgrade

on:
  push:
    branches:
      - feat/valuation-consistency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/valuation-consistency
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migration
        run: python3 scripts/apply_valuation_consistency_upgrade.py

      - name: Compile
        run: python3 -m py_compile scripts/*.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Report lint self-test
        run: python3 scripts/report_lint.py --self-test

      - name: Report lint fixtures
        run: python3 scripts/report_lint.py --fixtures tests/fixtures

      - name: Diff check
        run: git diff --check

      - name: Remove temporary migration machinery
        run: |
          rm scripts/apply_valuation_consistency_upgrade.py
          rm .github/workflows/apply-valuation-consistency.yml

      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add valuation consistency audit and scenario contract"
          git push origin HEAD:feat/valuation-consistency
